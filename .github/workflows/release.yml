name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    concurrency:
      group: pnd-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and branch ancestry
        id: release
        env:
          TAG: ${{ github.ref_name }}
        shell: python
        run: |
          import json, os, pathlib, re, subprocess
          version=json.loads(pathlib.Path('package.json').read_text())['version']
          assert re.fullmatch(r'\d{2}\.[1-9]\d*\.\d+(?:-rc\.[1-9]\d*)?',version)
          assert os.environ['TAG']=='v'+version, 'Tag and source version differ'
          prerelease='-rc.' in version
          branch='release/'+version.split('-')[0] if prerelease else 'main'
          subprocess.run(['git','merge-base','--is-ancestor','HEAD','origin/'+branch],check=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('version='+version+'\nprerelease='+str(prerelease).lower()+'\n')
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: |
          pnpm install --frozen-lockfile
          pnpm run build
          python scripts/check-release.py
          python scripts/package-release.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/pipapoen/pipapoen-node-descriptor:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/Pipapoen/pipapoen-node-descriptor
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          provenance: mode=max
          sbom: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf '%s\n' "ghcr.io/pipapoen/pipapoen-node-descriptor@$IMAGE_DIGEST" > build/release/IMAGE_DIGEST
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --draft --latest=false --generate-notes "${flags[@]}" build/release/*
          gh release edit "$TAG" --draft=false --latest=false
      - name: Promote stable image aliases
        if: steps.release.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: python scripts/image_tags.py
