name: Static demo
on:
  push:
    branches: [main]
    paths: ['demo/**', 'web/**', 'cmd/demo-wasm/**', 'internal/codec/**', 'internal/catalog/**', 'internal/geography/**', 'internal/democlient/**', 'internal/buildinfo/**', 'go.mod', 'go.sum', 'third_party/licenses/**', 'package.json', 'pnpm-lock.yaml', 'scripts/build-demo.mjs', 'scripts/demo-test.mjs', 'scripts/browser-select.mjs', 'scripts/testdata/demo.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: |
          pnpm install --frozen-lockfile
          pnpm run build:demo
          pnpm exec playwright install --with-deps chromium
          pnpm run test:demo
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
