name: Static demo
on:
  push:
    branches: [main]
    paths: ['demo/**', 'web/**', 'cmd/demo-wasm/**', 'internal/codec/**', 'internal/catalog/**', 'internal/geography/**', 'internal/democlient/**', 'internal/buildinfo/**', 'go.mod', 'go.sum', 'third_party/licenses/**', 'package.json', 'pnpm-lock.yaml', 'scripts/build-demo.mjs', 'scripts/demo-test.mjs', 'scripts/browser-select.mjs', 'scripts/testdata/demo.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - run: |
          pnpm install --frozen-lockfile
          pnpm run build:demo
          pnpm exec playwright install --with-deps chromium
          pnpm run test:demo
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
